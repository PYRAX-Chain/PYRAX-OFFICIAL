[package]
name = "pyrax-desktop"
version = "0.4.0"
description = "PYRAX Desktop Application"
authors = ["PYRAX Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "window-all", "dialog-all", "fs-all", "path-all", "process-all", "notification-all", "updater", "global-shortcut-all", "clipboard-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "4.0"
parking_lot = "0.12"
thiserror = "1.0"
which = "5.0"
num_cpus = "1.16"
blake3 = "1.5"
hex = "0.4"
libloading = "0.8"
rand = "0.8"
open = "5.0"
bincode = "1.3"

# NEURAX AI System dependencies
sysinfo = "0.30"          # System monitoring (CPU, RAM, temps)
nvml-wrapper = "0.10"     # NVIDIA GPU monitoring
chrono = "0.4"            # Timestamps
regex = "1.10"            # Log pattern matching
sha2 = "0.10"             # Hashing for cache keys
futures-util = "0.3"      # Async stream utilities for model download

# NEURAX Local LLM dependencies (GPU-accelerated inference)
# llama-cpp-2 provides bindings to llama.cpp for local model inference
# Supports CUDA (NVIDIA), Metal (Apple), Vulkan, and CPU backends
llama-cpp-2 = { version = "0.1", features = ["metal", "cuda"], optional = true }
hf-hub = { version = "0.3", optional = true }  # HuggingFace model downloads
candle-core = { version = "0.4", optional = true }       # Tensor operations
candle-transformers = { version = "0.4", optional = true } # Transformer models
tokenizers = { version = "0.15", optional = true }       # Tokenization

# Local workspace dependencies
pyrax-wallet = { path = "../../pyrax-wallet" }
pyrax-node = { path = "../../pyrax-node" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# LLM feature flags - enable for local AI inference
neurax-llm = ["llama-cpp-2", "hf-hub", "candle-core", "candle-transformers", "tokenizers"]
neurax-llm-cuda = ["neurax-llm", "llama-cpp-2/cuda"]   # NVIDIA GPU
neurax-llm-metal = ["neurax-llm", "llama-cpp-2/metal"] # Apple Silicon
neurax-llm-vulkan = ["neurax-llm"]                      # AMD/Intel GPU (via Vulkan)

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
