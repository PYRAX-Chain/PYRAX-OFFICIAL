[package]
name = "pyrax-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PYRAX full node - TriStream DAG consensus with BLAKE3/KAWPOW/ZK-STARK"

[lib]
name = "pyrax_node"
path = "src/lib.rs"

[[bin]]
name = "pyrax-node"
path = "src/main.rs"

[[bin]]
name = "pyrax-miner-test"
path = "src/bin/miner_test.rs"

[[bin]]
name = "tx-test"
path = "src/bin/tx_test.rs"

[[bin]]
name = "gpu-test"
path = "src/bin/gpu_test.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full", "sync"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Cryptography
blake3 = "1.5"
bech32 = "0.9"
sha2 = "0.10"
sha3 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
secp256k1 = { version = "0.29", features = ["recovery", "rand-std"] }
ripemd = "0.1"

# Storage
rocksdb = "0.22"

# P2P Networking - with WebSocket and QUIC for ISP bypass
libp2p = { version = "0.53", features = [
    "tcp", "noise", "yamux", "gossipsub", "mdns", "identify", "ping", "kad", 
    "tokio", "macros", "relay", "autonat", "dcutr",
    "websocket",  # ISP BYPASS: WebSocket transport looks like HTTP traffic
    "quic",       # ISP BYPASS: QUIC is UDP-based, hard to fingerprint
    "tls",        # Required for secure WebSocket (wss://)
    "dns"         # Required for DNS resolution in transports
] }

# UPnP for automatic NAT port mapping
igd-next = "0.14"

# CLI & Config
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON-RPC Server
jsonrpsee = { version = "0.21", features = ["server", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Misc
bytes = "1.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
libloading = "0.8"
walkdir = "2.4"
num-bigint = "0.4"
num-traits = "0.2"
num_cpus = "1.16"

# Types
ethereum-types = "0.14"
primitive-types = { version = "0.12", features = ["rlp", "serde"] }
rlp = "0.5"

# EVM
revm = { version = "3.5", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "0.4", features = ["serde", "rlp"] }
alloy-rlp = "0.3"

# Elliptic Curve / BN254 Pairing for EVM Precompiles (ecAdd, ecMul, ecPairing)
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"
ark-std = "0.4"

# WASM Runtime
wasmtime = "15.0"

[dev-dependencies]
tempfile = "3.9"
proptest = "1.4"
