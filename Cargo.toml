[workspace]
resolver = "2"
members = [
    "pyrax-node",
    "pyrax-wallet",
    "pyrax-desktop/src-tauri",
    "inferno-cli",
    "pyrax-metrics",
]

[workspace.package]
version = "0.3.20"
edition = "2021"
authors = ["PYRAX Team <dev@pyrax.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrax-official/pyrax"
homepage = "https://pyrax.org"
description = "PYRAX Blockchain - PoW Chain with AI Compute Integration"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# Cryptography - pin to versions compatible with stable Rust
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
k256 = { version = "=0.13.3", features = ["ecdsa", "schnorr"] }
rand = "0.8"
rand_chacha = "0.3"

# Database
rocksdb = "0.22"

# Networking
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "identify"] }

# RPC
jsonrpsee = { version = "0.21", features = ["server", "client", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# CLI & Config
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Misc
bytes = "1.5"
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "5.5"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 16  # Higher = less memory during compilation (was 1, caused OOM on server)
panic = "abort"
strip = true
opt-level = "z"     # Optimize for size

[profile.dev]
opt-level = 0
debug = true

