# PYRAX Docker Compose - Devnet Deployment
# Usage: docker compose -f docker-compose.devnet.yml up -d
# Server: 209.38.137.105
# Domain: pyrax-devnet.org

services:
  # NOTE: PYRAX Node runs via systemd on host, NOT Docker
  # See: /etc/systemd/system/pyrax-node.service
  # Ports on host: 28545 (RPC), 3333 (Stratum), 28547 (Staking), 30303 (P2P)
  # Docker containers access host node via 172.17.0.1

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pyrax-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pyrax
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pyrax_secure_password}
      - POSTGRES_DB=pyrax_marketing
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrax -d pyrax_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyrax-network

  # Redis for caching, sessions, job queues, and real-time pub/sub
  redis:
    image: redis:7-alpine
    container_name: pyrax-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyrax-network

  # Marketing/Proofing Hub - marketing.pyrax-devnet.org
  marketing:
    build:
      context: ./pyrax-core-marketing
      dockerfile: Dockerfile
    container_name: pyrax-marketing
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://pyrax:${POSTGRES_PASSWORD:-pyrax_secure_password}@postgres:5432/pyrax_marketing
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXT_PUBLIC_APP_URL=https://marketing.pyrax-devnet.org
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@pyrax.org}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pyrax-network

  # Main Website - pyrax-devnet.org
  website:
    build:
      context: ./pyrax-website
      dockerfile: Dockerfile
    container_name: pyrax-website
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_NETWORK=devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pyrax-network

  # Faucet - faucet.pyrax-devnet.org
  faucet:
    build:
      context: ./pyrax-faucet
      dockerfile: Dockerfile
    container_name: pyrax-faucet
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PYRAX_NETWORK=devnet
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY}
      - DEVNET_RPC_URL=http://host.docker.internal:28545
      - FAUCET_AMOUNT=${FAUCET_AMOUNT:-1000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pyrax-network

  # Documentation - docs.pyrax-devnet.org
  docs:
    build:
      context: ./pyrax-docs
      dockerfile: Dockerfile
      args:
        - DOCUSAURUS_URL=https://docs.pyrax-devnet.org
    container_name: pyrax-docs
    restart: unless-stopped
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pyrax-network

  # Block Explorer - explorer.pyrax-devnet.org
  explorer:
    build:
      context: ./pyrax-explorer
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_NETWORK=devnet
        - NEXT_PUBLIC_RPC_URL=https://rpc.pyrax-devnet.org
        - NEXT_PUBLIC_API_URL=https://api.pyrax-devnet.org
        - NEXT_PUBLIC_EXPLORER_URL=https://explorer.pyrax-devnet.org
    container_name: pyrax-explorer
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_NETWORK=devnet
      # Server-side RPC endpoints for API routes (uses host.docker.internal to reach host node)
      - DEVNET_RPC_URL=http://host.docker.internal:28545
      - STREAM_A_RPC=http://host.docker.internal:28545
      - STREAM_B_RPC=http://host.docker.internal:28545
      - STREAM_C_RPC=http://host.docker.internal:28545
      # Public RPC URLs for client-side (uses actual DNS)
      - NEXT_PUBLIC_RPC_URL=https://rpc.pyrax-devnet.org
      - NEXT_PUBLIC_API_URL=https://api.pyrax-devnet.org
      # Bootnode IPs for direct access
      - BOOTNODE1_IP=209.38.137.105
      - BOOTNODE2_IP=137.184.118.228
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pyrax-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pyrax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/devnet.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - website
      - faucet
      - docs
      - explorer
      - marketing
    networks:
      - pyrax-network

networks:
  pyrax-network:
    driver: bridge

volumes:
  nginx-cache:
  postgres-data:
  redis-data:
