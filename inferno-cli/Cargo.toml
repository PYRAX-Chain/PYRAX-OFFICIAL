[package]
name = "inferno-cli"
version = "0.3.20"
edition = "2021"
authors = ["PYRAX Chain <team@pyrax.org>"]
description = "Inferno CLI - Terminal-based node management for PYRAX blockchain"
license = "MIT"
repository = "https://github.com/PYRAX-Chain/PYRAX-OFFICIAL"
keywords = ["blockchain", "p2p", "cli", "node"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "inferno"
path = "src/main.rs"

[dependencies]
# CLI Framework
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.4"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP/Web
actix-web = "4.4"
actix-files = "0.6"
actix-cors = "0.7"
reqwest = { version = "0.11", features = ["json"] }

# Terminal UI
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
indicatif = "0.17"
colored = "2.1"
crossterm = "0.27"
ratatui = "0.25"

# Process Management
sysinfo = "0.30"
nix = { version = "0.27", features = ["signal", "process"], optional = true }

# Networking
local-ip-address = "0.5"
port_check = "0.1"

# SSH/Remote
ssh2 = "0.9"

# Docker
bollard = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
shellexpand = "3.1"
num_cpus = "1.16"
uuid = { version = "1.6", features = ["v4"] }
which = "6.0"
hostname = "0.3"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"
ctrlc = "3.4"

# Archive handling for self-update
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "handleapi", "tlhelp32"] }

# Unix-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "process"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
