name: Deploy to Devnet

on:
  push:
    branches:
      - devnet
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # Manual trigger only - NO tag triggers to prevent duplicate deploys
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BOOTNODE_1: 209.38.137.105
  BOOTNODE_2: 137.184.118.228

jobs:
  deploy:
    name: Build and Deploy to Devnet
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.BOOTNODE_1 }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ env.BOOTNODE_2 }} >> ~/.ssh/known_hosts

      - name: Sync code to Bootnode 1
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='target' \
            ./ root@${{ env.BOOTNODE_1 }}:/opt/pyrax/

      - name: Sync code to Bootnode 2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='target' \
            ./ root@${{ env.BOOTNODE_2 }}:/opt/pyrax/

      - name: Install Docker on Bootnode 1
        run: |
          ssh root@${{ env.BOOTNODE_1 }} << 'EOF'
          set -e
          
          if ! command -v docker &> /dev/null; then
            echo "=== INSTALLING DOCKER ==="
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable docker
            systemctl start docker
            echo "Docker installed successfully"
          else
            echo "Docker already installed"
          fi
          EOF

      - name: Configure Firewall for TriStream
        run: |
          ssh root@${{ env.BOOTNODE_1 }} << 'EOF'
          set -e
          
          echo "=== ENSURING DOCKER STARTS ON BOOT ==="
          systemctl enable docker
          systemctl start docker
          
          echo "=== CONFIGURING FIREWALL FOR TRISTREAM ==="
          
          # Install ufw if not present
          apt-get update -qq
          apt-get install -y -qq ufw
          
          # Allow SSH first (important!)
          ufw allow 22/tcp comment 'SSH'
          
          # Allow HTTP and HTTPS for Cloudflare
          ufw allow 80/tcp comment 'HTTP'
          ufw allow 443/tcp comment 'HTTPS'
          
          # Stream A: BLAKE3 PoW (internal via nginx)
          # Port 8545 is internal only
          
          # Stream A: BLAKE3 ASIC Mining - Stratum
          ufw allow 3334/tcp comment 'Stream A Stratum (BLAKE3 ASIC Mining)'
          
          # Stream B: KAWPOW GPU Mining - Stratum
          ufw allow 3333/tcp comment 'Stream B Stratum (GPU Mining)'
          
          # Stream C: ZK Staking (internal via nginx)
          # Port 8547 is internal only
          
          # Blockchain P2P ports
          ufw allow 30303/tcp comment 'P2P TCP'
          ufw allow 30304/udp comment 'P2P UDP'
          
          # Enable firewall (non-interactive)
          echo "y" | ufw enable || true
          
          # Show status
          ufw status verbose
          
          echo "=== FIREWALL CONFIGURED FOR ALL STREAMS ==="
          echo "  - Stream A RPC: Internal (nginx proxy)"
          echo "  - Stream B Stratum: 3333/tcp (direct)"
          echo "  - Stream C Staking: Internal (nginx proxy)"
          echo "  - P2P: 30303/tcp, 30304/udp"
          EOF

      - name: Build and Deploy PYRAX Node (TriStream)
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=20 root@${{ env.BOOTNODE_1 }} << 'EOF'
          set -e
          
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║     PYRAX Node Deployment - TriStream DAG Blockchain          ║"
          echo "║   Stream A (BLAKE3) | Stream B (KAWPOW) | Stream C (ZK)       ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          
          # Ensure swap exists to prevent OOM during Rust compilation
          # 8GB swap needed for compiling wasmtime and heavy crates
          echo "=== ENSURING SWAP SPACE FOR COMPILATION ==="
          SWAP_SIZE="8G"
          if [ -f /swapfile ]; then
            # Check if existing swap is large enough (at least 8GB)
            CURRENT_SIZE=$(ls -l /swapfile 2>/dev/null | awk '{print $5}')
            if [ "$CURRENT_SIZE" -lt 8589934592 ]; then
              echo "Existing swap too small, recreating with 8GB..."
              swapoff /swapfile 2>/dev/null || true
              rm -f /swapfile
            fi
          fi
          
          if [ ! -f /swapfile ]; then
            echo "Creating 8GB swap file..."
            fallocate -l $SWAP_SIZE /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=8192
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            echo "Swap created and enabled"
          else
            # Ensure swap is active
            swapon /swapfile 2>/dev/null || true
            echo "Swap already exists"
          fi
          free -h
          
          cd /opt/pyrax
          
          # Install Rust if not present
          if ! command -v cargo &> /dev/null; then
            echo "=== INSTALLING RUST ==="
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source ~/.cargo/env 2>/dev/null || true
          
          # Install build dependencies if needed
          if ! command -v cc &> /dev/null; then
            echo "=== INSTALLING BUILD DEPENDENCIES ==="
            apt-get update -qq
            apt-get install -y -qq build-essential pkg-config libssl-dev clang llvm-dev libclang-dev
          fi
          
          # Build pyrax-node (workspace build - binary goes to workspace root target/)
          echo "=== BUILDING PYRAX-NODE ==="
          cd /opt/pyrax
          
          # Verify swap is active
          echo "=== VERIFYING SWAP SPACE ==="
          swapon /swapfile 2>/dev/null || true
          free -h
          
          # Clean old build artifacts to force fresh compilation
          echo "Cleaning old build artifacts..."
          cargo clean -p pyrax-node 2>/dev/null || true
          rm -f /opt/pyrax/target/release/pyrax-node
          
          # Build pyrax-node with memory-optimized settings
          # -j 1: Single job to minimize memory usage
          # CARGO_BUILD_JOBS=1: Ensure no parallel codegen
          # codegen-units=1: Reduce memory per compilation unit
          echo "=== BUILDING PYRAX-NODE (memory-optimized) ==="
          export CARGO_BUILD_JOBS=1
          export RUSTFLAGS="-C codegen-units=1"
          cargo build --release -p pyrax-node -j 1
          
          # Stop running service and kill any orphan processes before replacing binary
          echo "=== STOPPING PYRAX-NODE SERVICE ==="
          systemctl stop pyrax-node 2>/dev/null || true
          sleep 2
          # Kill any orphan pyrax-node processes
          pkill -9 -f pyrax-node 2>/dev/null || true
          sleep 1
          
          # Verify no old process is running
          if pgrep -f pyrax-node; then
            echo "ERROR: pyrax-node still running after kill!"
            pkill -9 -f pyrax-node || true
            sleep 2
          fi
          
          # Free up memory after build before service operations
          echo "=== FREEING MEMORY AFTER BUILD ==="
          sync
          echo 3 > /proc/sys/vm/drop_caches
          sleep 2
          free -h
          
          # Install binary (workspace root target directory)
          echo "=== INSTALLING PYRAX-NODE BINARY ==="
          cp -f /opt/pyrax/target/release/pyrax-node /usr/local/bin/pyrax-node
          chmod +x /usr/local/bin/pyrax-node
          echo "Installed: $(pyrax-node --version)"
          
          # Show libp2p version from Cargo.lock for verification
          echo "=== DEPENDENCY VERSIONS ==="
          grep -A1 'name = "libp2p"' /opt/pyrax/Cargo.lock | head -4 || true
          
          # CRITICAL: Selective wipe - preserve node identity for stable peer IDs
          echo "=== WIPING CHAIN DATA (PRESERVING NODE IDENTITY) ==="
          mkdir -p /var/lib/pyrax/devnet
          # Preserve node.key for stable peer ID across deploys
          # Wipe only chain data, blocks, and cache - NOT identity
          rm -rf /var/lib/pyrax/devnet/chaindata 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/blocks 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/utxo 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/index 2>/dev/null || true
          rm -f /var/lib/pyrax/devnet/*.db 2>/dev/null || true
          rm -f /var/lib/pyrax/devnet/*.log 2>/dev/null || true
          # Keep: /var/lib/pyrax/node.key (stable peer ID)
          echo "Chain data wiped - node identity preserved for mesh stability"
          
          # Create systemd service for pyrax-node
          echo "=== CONFIGURING PYRAX-NODE SYSTEMD SERVICE ==="
          cat > /etc/systemd/system/pyrax-node.service << 'SERVICE'
          [Unit]
          Description=PYRAX TriStream Blockchain Node (Devnet)
          After=network.target
          Wants=network-online.target
          
          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/pyrax-node \
              --network devnet \
              --datadir /var/lib/pyrax/devnet \
              --node-key /var/lib/pyrax/node.key \
              --rpc --rpc-addr 0.0.0.0:28545 \
              --p2p --p2p-addr /ip4/0.0.0.0/tcp/30303 \
              --blake3-stratum --blake3-stratum-addr 0.0.0.0:3334 \
              --stratum --stratum-addr 0.0.0.0:3333 \
              --staking --staking-addr 0.0.0.0:28547 \
              --verbosity 2
          Restart=always
          RestartSec=5
          LimitNOFILE=65535
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          # Reload and enable service (with memory safety)
          echo "=== ENABLING SYSTEMD SERVICE ==="
          sync
          echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
          sleep 1
          systemctl daemon-reload
          sleep 1
          systemctl enable pyrax-node
          
          # Restart pyrax-node service
          echo "=== RESTARTING PYRAX-NODE SERVICE ==="
          sleep 2
          systemctl restart pyrax-node
          
          # Wait for node to fully start (it takes time to initialize)
          echo "=== WAITING FOR NODE TO START ==="
          for i in {1..30}; do
            if ss -tlnp | grep -q ':28545'; then
              echo "RPC port 28545 is listening after ${i}s"
              break
            fi
            echo "Waiting for node... (${i}/30)"
            sleep 1
          done
          
          # Show service status
          systemctl status pyrax-node --no-pager || true
          
          # Verify all streams are listening
          echo "=== VERIFYING TRISTREAM PORTS ==="
          ss -tlnp | grep -E '(28545|3333|28547|30303)' || echo "Warning: Some ports not yet listening"
          
          # Test RPC endpoint
          echo "=== TESTING RPC ENDPOINT ==="
          curl -s -X POST -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            http://127.0.0.1:28545 || echo "RPC not responding yet"
          
          # Show node logs
          echo "=== RECENT NODE LOGS ==="
          journalctl -u pyrax-node --no-pager -n 50 || true
          
          echo "=== PYRAX NODE DEPLOYED ==="
          EOF

      - name: Deploy PYRAX Node to Bootnode 2 (P2P Only)
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=20 root@${{ env.BOOTNODE_2 }} << 'EOF'
          set -e
          
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║     PYRAX Bootnode 2 Deployment (P2P Redundancy)              ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          
          # Ensure 8GB swap exists to prevent OOM during compilation
          echo "=== ENSURING SWAP SPACE ==="
          SWAP_SIZE="8G"
          if [ -f /swapfile ]; then
            CURRENT_SIZE=$(ls -l /swapfile 2>/dev/null | awk '{print $5}')
            if [ "$CURRENT_SIZE" -lt 8589934592 ]; then
              echo "Existing swap too small, recreating with 8GB..."
              swapoff /swapfile 2>/dev/null || true
              rm -f /swapfile
            fi
          fi
          
          if [ ! -f /swapfile ]; then
            echo "Creating 8GB swap file..."
            fallocate -l $SWAP_SIZE /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=8192
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          else
            swapon /swapfile 2>/dev/null || true
          fi
          free -h
          
          cd /opt/pyrax
          
          # Install Rust if not present
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source ~/.cargo/env 2>/dev/null || true
          
          # Install build dependencies
          if ! command -v cc &> /dev/null; then
            apt-get update -qq
            apt-get install -y -qq build-essential pkg-config libssl-dev clang llvm-dev libclang-dev ufw
          fi
          
          # Configure firewall (P2P only, no web services)
          echo "=== CONFIGURING FIREWALL ==="
          ufw allow 22/tcp comment 'SSH'
          ufw allow 30303/tcp comment 'P2P TCP'
          ufw allow 30304/udp comment 'P2P UDP'
          ufw allow 28545/tcp comment 'RPC'
          echo "y" | ufw enable || true
          
          # Build pyrax-node with memory-optimized settings
          echo "=== BUILDING PYRAX-NODE (memory-optimized) ==="
          cargo clean -p pyrax-node 2>/dev/null || true
          export CARGO_BUILD_JOBS=1
          export RUSTFLAGS="-C codegen-units=1"
          cargo build --release -p pyrax-node -j 1
          
          # Stop and replace binary
          systemctl stop pyrax-node 2>/dev/null || true
          pkill -9 -f pyrax-node 2>/dev/null || true
          sleep 2
          
          cp -f /opt/pyrax/target/release/pyrax-node /usr/local/bin/pyrax-node
          chmod +x /usr/local/bin/pyrax-node
          
          # Selective wipe - preserve node identity for stable peer IDs
          mkdir -p /var/lib/pyrax/devnet
          rm -rf /var/lib/pyrax/devnet/chaindata 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/blocks 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/utxo 2>/dev/null || true
          rm -rf /var/lib/pyrax/devnet/index 2>/dev/null || true
          rm -f /var/lib/pyrax/devnet/*.db 2>/dev/null || true
          rm -f /var/lib/pyrax/devnet/*.log 2>/dev/null || true
          
          # Create systemd service (connects to Bootnode 1 as peer)
          cat > /etc/systemd/system/pyrax-node.service << 'SERVICE'
          [Unit]
          Description=PYRAX Bootnode 2 (Devnet P2P)
          After=network.target
          
          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/pyrax-node \
              --network devnet \
              --datadir /var/lib/pyrax/devnet \
              --node-key /var/lib/pyrax/node.key \
              --rpc --rpc-addr 0.0.0.0:28545 \
              --p2p --p2p-addr /ip4/0.0.0.0/tcp/30303 \
              --peer /ip4/209.38.137.105/tcp/30303/p2p/12D3KooWQGCFPC1eRd8fWZE6GSZfbGe5UgRVDSXhLkg3H7b95MMk \
              --verbosity 2
          Restart=always
          RestartSec=5
          LimitNOFILE=65535
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          # Reload and enable service (with memory safety)
          sync
          echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
          sleep 1
          systemctl daemon-reload
          sleep 1
          systemctl enable pyrax-node
          sleep 2
          systemctl restart pyrax-node
          
          # Wait for startup
          for i in {1..30}; do
            if ss -tlnp | grep -q ':30303'; then
              echo "P2P port 30303 listening after ${i}s"
              break
            fi
            sleep 1
          done
          
          # Get and display the peer ID
          echo "=== BOOTNODE 2 PEER ID ==="
          sleep 5
          journalctl -u pyrax-node --no-pager -n 100 | grep -i "Local peer" || echo "Peer ID will appear in logs"
          
          echo "=== BOOTNODE 2 DEPLOYED ==="
          EOF

      - name: Get Bootnode 2 Peer ID
        id: bootnode2_peer_id
        run: |
          echo "=== RETRIEVING BOOTNODE 2 PEER ID ==="
          sleep 15
          
          # Try multiple patterns to find the peer ID
          PEER_ID=$(ssh root@${{ env.BOOTNODE_2 }} "journalctl -u pyrax-node --no-pager -n 500 2>/dev/null | grep -oE '12D3KooW[a-zA-Z0-9]+' | head -1" || echo "")
          
          if [ -z "$PEER_ID" ]; then
            # Try reading from node key file
            PEER_ID=$(ssh root@${{ env.BOOTNODE_2 }} "cat /var/lib/pyrax/node.key 2>/dev/null | head -1" || echo "")
          fi
          
          if [ -n "$PEER_ID" ]; then
            echo "✅ BOOTNODE 2 PEER ID: $PEER_ID"
            echo "peer_id=$PEER_ID" >> $GITHUB_OUTPUT
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "  IMPORTANT: Update desktop app with this peer ID:"
            echo "  File: pyrax-desktop/src-tauri/src/commands/node.rs"
            echo "  Replace: 12D3KooWPEER2PLACEHOLDER228"
            echo "  With:    $PEER_ID"
            echo "════════════════════════════════════════════════════════════"
          else
            echo "⚠️ Could not extract peer ID automatically"
            echo "Check logs manually:"
            ssh root@${{ env.BOOTNODE_2 }} "journalctl -u pyrax-node --no-pager -n 100" || true
          fi

      - name: Verify P2P Connectivity Between Bootnodes
        run: |
          echo "=== VERIFYING P2P MESH FORMATION ==="
          sleep 10
          
          # Check Bootnode 1 peers
          echo "Bootnode 1 peer count:"
          curl -sf --max-time 10 -X POST http://${{ env.BOOTNODE_1 }}:28545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getNetworkInfo","params":[],"id":1}' 2>/dev/null | jq -r '.result.peer_count // "RPC not ready"' || echo "Check manually"
          
          # Check Bootnode 2 peers
          echo "Bootnode 2 peer count:"
          curl -sf --max-time 10 -X POST http://${{ env.BOOTNODE_2 }}:28545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getNetworkInfo","params":[],"id":1}' 2>/dev/null | jq -r '.result.peer_count // "RPC not ready"' || echo "Check manually"
          
          # Check if bootnodes can see each other
          echo ""
          echo "Checking bootnode mesh..."
          B1_PEERS=$(curl -sf --max-time 10 -X POST http://${{ env.BOOTNODE_1 }}:28545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getNetworkInfo","params":[],"id":1}' 2>/dev/null || echo "{}")
          
          if echo "$B1_PEERS" | grep -q "${{ env.BOOTNODE_2 }}"; then
            echo "✅ Bootnode 1 can see Bootnode 2"
          else
            echo "⚠️ Bootnodes may need time to discover each other"
          fi

      - name: Deploy Web Services (Docker)
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.BOOTNODE_1 }} << 'EOF'
          set -e
          
          cd /opt/pyrax
          
          COMPOSE_FILE="docker-compose.devnet.yml"
          
          echo "=== KILLING CONFLICTING PROCESSES ==="
          systemctl stop nginx 2>/dev/null || true
          systemctl stop apache2 2>/dev/null || true
          systemctl disable nginx 2>/dev/null || true
          systemctl disable apache2 2>/dev/null || true
          
          fuser -k 80/tcp 443/tcp 3000/tcp 3001/tcp 3002/tcp 3003/tcp 2>/dev/null || true
          sleep 2
          
          echo "=== STOPPING OLD CONTAINERS ==="
          docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
          
          echo "=== FORCE STOPPING ALL PYRAX CONTAINERS ==="
          # Stop all containers with pyrax in the name
          docker ps -a --filter "name=pyrax" -q | xargs -r docker stop 2>/dev/null || true
          
          echo "=== REMOVING ALL PYRAX CONTAINERS ==="
          # Remove all containers with pyrax in the name (including stopped ones)
          docker ps -a --filter "name=pyrax" -q | xargs -r docker rm -f 2>/dev/null || true
          
          # Also remove by explicit names in case filter missed any
          docker rm -f pyrax-node pyrax-website pyrax-faucet pyrax-docs pyrax-explorer pyrax-nginx pyrax-marketing pyrax-postgres pyrax-redis 2>/dev/null || true
          
          echo "=== REMOVING STALE NETWORKS ==="
          docker network rm pyrax_pyrax-network 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          
          echo "=== PRUNING UNUSED DOCKER RESOURCES ==="
          docker container prune -f 2>/dev/null || true
          
          echo "=== PRUNING BUILDKIT CACHE ==="
          docker builder prune -f 2>/dev/null || true
          
          echo "=== BUILDING IMAGES (with cache) ==="
          # Build only web services (node is managed by systemd)
          docker compose -f $COMPOSE_FILE build website faucet docs explorer marketing nginx postgres redis
          
          echo "=== STOPPING EXISTING CONTAINERS ==="
          # Stop and remove existing containers to avoid conflicts
          docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
          docker rm -f pyrax-website pyrax-faucet pyrax-docs pyrax-explorer pyrax-marketing pyrax-nginx pyrax-postgres pyrax-redis 2>/dev/null || true
          
          echo "=== STARTING WEB SERVICES ==="
          # Start only web services - NOT the node (we use systemd for that)
          docker compose -f $COMPOSE_FILE up -d postgres redis website faucet docs explorer marketing nginx
          
          echo "=== WAITING FOR HEALTH CHECKS ==="
          sleep 15
          
          echo "=== SERVICE STATUS ==="
          docker compose -f $COMPOSE_FILE ps
          
          echo "=== NGINX LOGS ==="
          docker logs pyrax-nginx --tail=20 2>&1 || echo "Nginx not running yet"
          
          echo "=== TESTING CONNECTIVITY ==="
          curl -sf http://localhost:80 -o /dev/null && echo "Port 80: OK" || echo "Port 80: FAILED"
          
          echo "=== LISTENING PORTS ==="
          ss -tlnp | grep -E ':80|:443|:3000|:3001|:3002|:3003|:28545|:3333|:3334|:28547|:30303'
          
          echo "=== CLEANUP OLD IMAGES ==="
          docker image prune -f
          
          echo "=== CREATING SYSTEMD SERVICE FOR DOCKER AUTO-START ==="
          cat > /etc/systemd/system/pyrax-devnet.service << 'SERVICE'
          [Unit]
          Description=PYRAX Devnet Web Stack
          After=docker.service pyrax-node.service
          Requires=docker.service
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/pyrax
          ExecStart=/usr/bin/docker compose -f docker-compose.devnet.yml up -d postgres redis website faucet docs explorer marketing nginx
          ExecStop=/usr/bin/docker compose -f docker-compose.devnet.yml down
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          systemctl daemon-reload
          systemctl enable pyrax-devnet.service
          
          echo "=== ALL SERVICES WILL AUTO-START ON BOOT ==="
          EOF

      - name: Health Check - All Services
        run: |
          sleep 20
          echo "========================================"
          echo "   PYRAX DEVNET HEALTH CHECK"
          echo "========================================"
          
          echo ""
          echo "=== TRISTREAM NODE (Direct IP) ==="
          
          # Stream A - RPC (BLAKE3)
          STREAM_A=$(curl -sf --max-time 10 -X POST http://${{ env.BOOTNODE_1 }}:28545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getChainInfo","params":[],"id":1}' 2>/dev/null || echo "")
          if echo "$STREAM_A" | grep -q '"result"'; then
            echo "✓ Stream A RPC (28545): OK"
          else
            echo "✗ Stream A RPC (28545): FAILED"
          fi
          
          # Stream A - BLAKE3 Stratum (ASIC)
          nc -zv ${{ env.BOOTNODE_1 }} 3334 -w 3 2>&1 && echo "✓ Stream A BLAKE3 Stratum (3334): OPEN" || echo "✗ Stream A BLAKE3 Stratum (3334): CLOSED"
          
          # Stream B - Stratum (KAWPOW)
          nc -zv ${{ env.BOOTNODE_1 }} 3333 -w 3 2>&1 && echo "✓ Stream B KAWPOW Stratum (3333): OPEN" || echo "✗ Stream B KAWPOW Stratum (3333): CLOSED"
          
          # Stream C - Staking RPC (ZK)
          STREAM_C=$(curl -sf --max-time 10 -X POST http://${{ env.BOOTNODE_1 }}:28547 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"pyrax_getStakingStats","params":[],"id":1}' 2>/dev/null || echo "")
          if echo "$STREAM_C" | grep -q '"result"'; then
            echo "✓ Stream C Staking (28547): OK"
          else
            nc -zv ${{ env.BOOTNODE_1 }} 28547 -w 3 2>&1 && echo "⚠ Stream C Staking (28547): Port OPEN (RPC may not have staking method)" || echo "✗ Stream C Staking (28547): CLOSED"
          fi
          
          # P2P Bootnode 1
          nc -zv ${{ env.BOOTNODE_1 }} 30303 -w 3 2>&1 && echo "✓ Bootnode 1 P2P (30303): OPEN" || echo "✗ Bootnode 1 P2P (30303): CLOSED"
          
          echo ""
          echo "=== BOOTNODE 2 (P2P Redundancy) ==="
          nc -zv ${{ env.BOOTNODE_2 }} 30303 -w 3 2>&1 && echo "✓ Bootnode 2 P2P (30303): OPEN" || echo "✗ Bootnode 2 P2P (30303): CLOSED"
          nc -zv ${{ env.BOOTNODE_2 }} 28545 -w 3 2>&1 && echo "✓ Bootnode 2 RPC (28545): OPEN" || echo "✗ Bootnode 2 RPC (28545): CLOSED"
          
          echo ""
          echo "=== WEB SERVICES ==="
          curl -sf -o /dev/null http://${{ env.BOOTNODE_1 }} && echo "✓ Website (HTTP): OK" || echo "⚠ Website: Check Cloudflare"
          
          echo ""
          echo "========================================"
          echo "   DEPLOYMENT COMPLETE"
          echo "========================================"
          echo ""
          echo "Bootnode 1 (Primary - ${{ env.BOOTNODE_1 }}):"
          echo "  Stream A RPC:          http://${{ env.BOOTNODE_1 }}:28545"
          echo "  Stream A BLAKE3:       stratum+tcp://${{ env.BOOTNODE_1 }}:3334"
          echo "  Stream B KAWPOW:       stratum+tcp://${{ env.BOOTNODE_1 }}:3333"
          echo "  Stream C Staking:      http://${{ env.BOOTNODE_1 }}:28547"
          echo "  P2P:              /ip4/${{ env.BOOTNODE_1 }}/tcp/30303"
          echo ""
          echo "Bootnode 2 (Redundancy - ${{ env.BOOTNODE_2 }}):"
          echo "  RPC:              http://${{ env.BOOTNODE_2 }}:28545"
          echo "  P2P:              /ip4/${{ env.BOOTNODE_2 }}/tcp/30303"
          echo ""
          echo "Web Services (via Cloudflare):"
          echo "  Website:  https://pyrax-devnet.org"
          echo "  Explorer: https://explorer.pyrax-devnet.org"
          echo "  Faucet:   https://faucet.pyrax-devnet.org"
          echo "  Docs:     https://docs.pyrax-devnet.org"
          echo "  Marketing: https://marketing.pyrax-devnet.org"
          echo ""
